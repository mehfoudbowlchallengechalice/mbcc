[theme]
base = "light"
primaryColor = "#a64012"
backgroundColor = "#f7f5f0"
secondaryBackgroundColor = "#ffffff"
textColor = "#172432"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# Avoid module-unloading races while hosted source files are updated.
# Reboot the hosted app after deploying Python changes. For local live reload,
# start Streamlit with --server.fileWatcherType=auto.
fileWatcherType = "none"
